<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <clipPath id="crestClip">
      <path d="M50 8 C76 8, 88 18, 88 46 C88 74, 50 94, 50 94 C50 94, 12 74, 12 46 C12 18, 24 8, 50 8 Z" />
    </clipPath>
  </defs>

  <!-- Outer Gold Shield -->
  <path d="M50 6 C78 6, 91 16, 91 46 C91 76, 50 96, 50 96 C50 96, 9 76, 9 46 C9 16, 22 6, 50 6 Z" 
        fill="#0b101b" stroke="url(#goldBorder)" stroke-width="3" />

  <g clip-path="url(#crestClip)">
    <!-- Top Left: St. George Cross -->
    <rect x="10" y="8" width="40" height="38" fill="#ffffff" />
    <rect x="26" y="8" width="8" height="38" fill="#dc2626" />
    <rect x="10" y="23" width="40" height="8" fill="#dc2626" />

    <!-- Top Right: Catalan Senyera Stripes (Yellow & Red) -->
    <rect x="50" y="8" width="40" height="38" fill="#facc15" />
    <rect x="58" y="8" width="6" height="38" fill="#dc2626" />
    <rect x="72" y="8" width="6" height="38" fill="#dc2626" />
    <rect x="85" y="8" width="6" height="38" fill="#dc2626" />

    <!-- Center Belt Gold Line -->
    <rect x="10" y="44" width="80" height="6" fill="#ca8a04" />
    <rect x="10" y="45.5" width="80" height="3" fill="#fde047" />

    <!-- Bottom: Blaugrana Stripes -->
    <!-- Blue base -->
    <rect x="10" y="50" width="80" height="50" fill="#004d98" />
    <!-- Garnet vertical stripes -->
    <rect x="24" y="50" width="13" height="50" fill="#a50044" />
    <rect x="50" y="50" width="13" height="50" fill="#a50044" />
    <rect x="76" y="50" width="13" height="50" fill="#a50044" />

    <!-- Center Vintage Football -->
    <circle cx="50" cy="72" r="12" fill="#eab308" stroke="#713f12" stroke-width="1.5" />
    <!-- Ball Seams -->
    <path d="M42 66 C46 72, 54 72, 58 66 M42 78 C46 72, 54 72, 58 78 M50 60 L50 84" 
          stroke="#854d0e" stroke-width="1.2" fill="none" />
  </g>
</svg>