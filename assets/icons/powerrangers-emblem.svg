<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spdShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="spdGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="spdRedBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="48%" stop-color="#ef4444" />
      <stop offset="52%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Police / Space Patrol Delta Shield Silhouette -->
  <path d="M50 6 L88 20 L80 68 L50 94 L20 68 L12 20 Z" fill="url(#spdShield)" stroke="url(#spdGold)" stroke-width="2.5" />

  <!-- Inner Dual Siren Stripe (Red / Blue) -->
  <path d="M50 14 L80 25 L74 64 L50 86 L26 64 L20 25 Z" fill="none" stroke="url(#spdRedBlue)" stroke-width="2.2" />

  <!-- Center Delta Star Emblem -->
  <polygon points="50,24 57,40 74,42 61,54 65,70 50,60 35,70 39,54 26,42 43,40" fill="url(#spdGold)" stroke="#fef08a" stroke-width="1" />
  
  <!-- S.P.D. Bold Letters -->
  <text x="50" y="55" fill="#020617" font-family="'Arial Black', sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">S.P.D.</text>
  
  <!-- Flashing Emergency Lights at Crown -->
  <circle cx="34" cy="12" r="3.5" fill="#ef4444" />
  <circle cx="66" cy="12" r="3.5" fill="#38bdf8" />

  <!-- Judgement Scanner Crosshair Ring -->
  <circle cx="50" cy="51" r="23" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.6" />
</svg>
