<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="goldMorpher" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>
    <linearGradient id="rangerPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="boltYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Morpher Diamond Outer Frame -->
  <polygon points="50,6 94,50 50,94 6,50" fill="url(#rangerPlate)" stroke="url(#goldMorpher)" stroke-width="3" />
  <polygon points="50,12 88,50 50,88 12,50" fill="none" stroke="#dc2626" stroke-width="1.5" />

  <!-- Center Power Coin Circle -->
  <circle cx="50" cy="50" r="26" fill="#0f172a" stroke="url(#goldMorpher)" stroke-width="2" />

  <!-- Iconic Lightning Bolt -->
  <polygon points="54,26 40,50 49,50 43,74 62,46 51,46" fill="url(#boltYellow)" filter="url(#boltGlow)" stroke="#fde047" stroke-width="0.8" />

  <!-- Dragonzord / Ranger Diamond Teeth -->
  <polygon points="50,16 53,22 47,22" fill="#22c55e" />
  <polygon points="50,84 53,78 47,78" fill="#22c55e" />
  <polygon points="16,50 22,47 22,53" fill="#ef4444" />
  <polygon points="84,50 78,47 78,53" fill="#3b82f6" />
</svg>