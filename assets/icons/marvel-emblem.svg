<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="spiderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="thorBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="lightningGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="46" fill="#090d16" stroke="url(#thorBlue)" stroke-width="2.5" />

  <!-- Left Half: Spider-Man Web Mask -->
  <path d="M50 8 C30 8, 12 24, 12 50 C12 74, 30 92, 50 92 Z" fill="url(#spiderRed)" />
  <!-- Spider Web Lines -->
  <path d="M50 50 L14 42 M50 50 L18 28 M50 50 L32 14 M50 50 L20 68 M50 50 L34 86" stroke="#000000" stroke-width="1.2" opacity="0.6" />
  <path d="M30 30 C24 38, 24 58, 30 68 M38 22 C32 34, 32 64, 38 78" stroke="#000000" stroke-width="1.2" fill="none" opacity="0.6" />
  <!-- Spider-Man Eye Lens -->
  <path d="M46 32 C36 34, 26 44, 28 54 C32 58, 44 48, 46 32 Z" fill="#ffffff" stroke="#000000" stroke-width="2" />

  <!-- Right Half: Thor & Asgardian Realm -->
  <path d="M50 8 C70 8, 88 24, 88 50 C88 74, 70 92, 50 92 Z" fill="url(#thorBlue)" />

  <!-- Thor's Hammer (Mjolnir) Silhouette -->
  <!-- Hammer Head -->
  <rect x="58" y="32" width="22" height="14" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
  <rect x="56" y="34" width="2" height="10" fill="#94a3b8" />
  <rect x="80" y="34" width="2" height="10" fill="#94a3b8" />
  <!-- Hammer Handle -->
  <rect x="67" y="46" width="4" height="22" fill="#92400e" stroke="#451a03" stroke-width="1" />
  <!-- Handle Wrap bands -->
  <line x1="67" y1="52" x2="71" y2="52" stroke="#fde047" stroke-width="1" />
  <line x1="67" y1="58" x2="71" y2="58" stroke="#fde047" stroke-width="1" />
  <line x1="67" y1="64" x2="71" y2="64" stroke="#fde047" stroke-width="1" />

  <!-- Crackling Lightning Bolt across Divider -->
  <path d="M50 6 L53 36 L47 46 L55 48 L46 76 L52 74 L48 94" 
        stroke="url(#lightningGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>