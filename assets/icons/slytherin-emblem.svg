<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="slytherinShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#011811" />
    </linearGradient>
    <linearGradient id="silverTrim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="snakeSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="80%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Gothic Shield Outline -->
  <path d="M50 6 C78 6, 88 18, 88 44 C88 72, 50 94, 50 94 C50 94, 12 72, 12 44 C12 18, 22 6, 50 6 Z" 
        fill="url(#slytherinShield)" stroke="url(#silverTrim)" stroke-width="3" />
  
  <!-- Inner Shield Inset -->
  <path d="M50 12 C72 12, 82 22, 82 44 C82 68, 50 86, 50 86 C50 86, 18 68, 18 44 C18 22, 28 12, 50 12 Z" 
        fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="3,2" stroke-opacity="0.4" />

  <!-- Coiled Royal Serpent -->
  <!-- Tail & Body Loop -->
  <path d="M48 76 C36 76, 28 66, 32 54 C35 44, 46 42, 54 44 C62 46, 68 38, 64 28 C60 20, 48 20, 42 26 C38 30, 36 34, 32 34 C28 34, 28 26, 36 20 C46 14, 66 14, 72 26 C78 38, 68 54, 56 52 C48 50, 42 54, 42 62 C42 68, 48 70, 52 68 C56 66, 58 68, 56 72 C54 75, 51 76, 48 76 Z" 
        fill="url(#snakeSkin)" filter="url(#emeraldGlow)" />

  <!-- Snake Head Details -->
  <path d="M36 20 C34 18, 30 19, 29 22 C28 25, 30 28, 34 27 C38 26, 38 22, 36 20 Z" fill="#4ade80" />
  <!-- Ruby Eye -->
  <circle cx="32" cy="22" r="1.5" fill="#ef4444" />
  <circle cx="32.3" cy="21.7" r="0.6" fill="#ffffff" />
  <!-- Forked Tongue -->
  <path d="M28 24 L22 25 M22 25 L19 22 M22 25 L19 27" stroke="#ef4444" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Silver Star Accents -->
  <circle cx="70" cy="62" r="1.5" fill="#e2e8f0" opacity="0.8" />
  <circle cx="30" cy="70" r="1.5" fill="#e2e8f0" opacity="0.8" />
</svg>