<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="kolkataBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#1f1015" />
      <stop offset="100%" stop-color="#090508" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <linearGradient id="chaiSteam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="goldMusic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Circular Heritage Terracotta Medallion -->
  <circle cx="50" cy="50" r="45" fill="url(#kolkataBg)" stroke="#f43f5e" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2,2" stroke-opacity="0.6" />

  <!-- Howrah Bridge Cantilever Truss Silhouette (Upper Horizon) -->
  <path d="M16 42 L26 24 L50 34 L74 24 L84 42 Z" fill="none" stroke="#f43f5e" stroke-width="1.6" opacity="0.4" />
  <path d="M26 24 L26 42 M38 29 L38 42 M50 34 L50 42 M62 29 L62 42 M74 24 L74 42" stroke="#f43f5e" stroke-width="0.9" opacity="0.3" />
  <!-- Bridge Roadway / Deck -->
  <line x1="14" y1="42" x2="86" y2="42" stroke="#fbbf24" stroke-width="1.6" opacity="0.65" />

  <!-- Baul Ektara & Musical Notes (Right Side - Melody & Rabindrasangeet / Bangla Rock) -->
  <!-- Ektara Resonator Bowl -->
  <ellipse cx="73" cy="56" rx="6" ry="7" fill="url(#terracotta)" stroke="#fbbf24" stroke-width="1" />
  <!-- Ektara Bamboo Arms & Neck -->
  <path d="M68 53 L72 26 L74 26 L78 53" fill="none" stroke="#fde047" stroke-width="1.2" />
  <line x1="73" y1="26" x2="73" y2="56" stroke="#ffffff" stroke-width="0.7" opacity="0.8" />
  <circle cx="73" cy="25" r="2.2" fill="#f59e0b" />
  <!-- Floating Musical Notes -->
  <path d="M80 32 L84 30 L84 36 M80 34 L80 40" stroke="url(#goldMusic)" stroke-width="1.2" fill="none" />
  <circle cx="79" cy="40" r="1.5" fill="#fde047" />
  <circle cx="83" cy="36" r="1.5" fill="#fde047" />

  <!-- College Street Literature Nib (Left Side - Cultural Adda & Poetry) -->
  <path d="M22 66 L27 48 L31 50 L27 68 Z" fill="#fbbf24" opacity="0.85" />
  <line x1="26" y1="56" x2="23" y2="64" stroke="#090508" stroke-width="0.8" />
  <circle cx="28.5" cy="52" r="0.9" fill="#090508" />

  <!-- Center: Steaming Traditional Earthen Clay Cup (Matir Bhar er Cha) -->
  <!-- Steam Trails -->
  <path d="M44 44 C42 38, 46 34, 44 28" stroke="url(#chaiSteam)" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M50 44 C52 38, 48 32, 51 26" stroke="url(#chaiSteam)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M56 44 C54 40, 58 34, 56 30" stroke="url(#chaiSteam)" stroke-width="1.6" stroke-linecap="round" fill="none" />

  <!-- Clay Cup Body -->
  <path d="M38 48 C38 46, 62 46, 62 48 L57 68 C56 71, 44 71, 43 68 Z" fill="url(#terracotta)" stroke="#fed7aa" stroke-width="1" />
  <ellipse cx="50" cy="48" rx="12" ry="2.2" fill="#ea580c" stroke="#fed7aa" stroke-width="0.8" />

  <!-- Traditional Golden Aloo / Rosogolla in Clay Handi Motif (Bottom) -->
  <circle cx="50" cy="74" r="3.2" fill="#facc15" stroke="#b45309" stroke-width="0.8" opacity="0.95" />
  <circle cx="44" cy="75" r="2.6" fill="#fef08a" stroke="#d97706" stroke-width="0.7" opacity="0.9" />
  <circle cx="56" cy="75" r="2.6" fill="#fef08a" stroke="#d97706" stroke-width="0.7" opacity="0.9" />

  <!-- Bengali Heritage Banner Text -->
  <text x="50" y="87" fill="#fbbf24" font-family="'Space Grotesk', serif" font-size="5.5" font-weight="bold" text-anchor="middle" letter-spacing="0.8">কলকাতা • CUISINE &amp; MUSIC</text>
</svg>
